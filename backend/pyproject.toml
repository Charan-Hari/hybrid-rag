[project]
name = "hybrid-rag"
version = "0.1.0"
description = "Hybrid RAG backend: hybrid retrieval + re-ranking + streaming generation with citations."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-multipart>=0.0.9",
    "chromadb>=0.5.5",
    "rank-bm25>=0.2.2",
    "pypdf>=4.3.1",
    "python-docx>=1.1.2",
    "unstructured>=0.15.0 ; python_version >= '3.11'",
    "groq>=0.9.0",
    "google-generativeai>=0.7.2",
    "httpx>=0.27.0",
    "slowapi>=0.1.9",
    "python-dotenv>=1.0.1",
    "ragas>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
